<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Eye Effect</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
</head>
<body>
    <input type="file" id="upload" accept="image/*">
    <button id="download">Download</button>
    <br>
    <div id="canvas-container"></div>

    <script>
        let img;
        let fisheyeImg;
        let canvas;

        document.getElementById('upload').onchange = function(event) {
            let reader = new FileReader();
            reader.onload = function(e) {
                img = new Image();
                img.onload = function() {
                    applyFishEyeEffect();
                };
                img.src = e.target.result;
            }
            reader.readAsDataURL(event.target.files[0]);
        };

        function applyFishEyeEffect() {
            const sketch = (p) => {
                p.setup = () => {
                    canvas = p.createCanvas(img.width, img.height);
                    canvas.parent('canvas-container');
                    fisheyeImg = p.createImage(img.width, img.height);
                    const imgP5 = p.createImage(img.width, img.height);
                    imgP5.drawingContext.drawImage(img, 0, 0, img.width, img.height);
                    imgP5.loadPixels();
                    fisheyeImg.loadPixels();

                    let centerX = img.width / 2;
                    let centerY = img.height / 2;
                    let maxRadius = p.dist(0, 0, centerX, centerY);

                    for (let y = 0; y < img.height; y++) {
                        for (let x = 0; x < img.width; x++) {
                            let dx = x - centerX;
                            let dy = y - centerY;
                            let distFromCenter = p.sqrt(dx * dx + dy * dy);
                            let r = distFromCenter / maxRadius;
                            let theta = p.atan2(dy, dx);

                            let srcX = centerX + r * r * maxRadius * p.cos(theta);
                            let srcY = centerY + r * r * maxRadius * p.sin(theta);

                            if (srcX >= 0 && srcX < img.width && srcY >= 0 && srcY < img.height) {
                                let srcIndex = 4 * (p.floor(srcX) + p.floor(srcY) * img.width);
                                let destIndex = 4 * (x + y * img.width);
                                fisheyeImg.pixels[destIndex] = imgP5.pixels[srcIndex];
                                fisheyeImg.pixels[destIndex + 1] = imgP5.pixels[srcIndex + 1];
                                fisheyeImg.pixels[destIndex + 2] = imgP5.pixels[srcIndex + 2];
                                fisheyeImg.pixels[destIndex + 3] = imgP5.pixels[srcIndex + 3];
                            }
                        }
                    }

                    fisheyeImg.updatePixels();
                    p.image(fisheyeImg, 0, 0);
                };
            };

            new p5(sketch);
        }

        document.getElementById('download').onclick = function() {
            if (fisheyeImg) {
                fisheyeImg.save('fisheye-image', 'jpg');
            }
        };
    </script>
</body>
</html>
