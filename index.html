<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前端練習小天地 | Frontend Playground</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', '微軟正黑體', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 3rem;
            animation: fadeInDown 0.6s ease-out;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .demos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .demo-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
            animation: fadeInUp 0.6s ease-out;
            animation-fill-mode: both;
        }

        .demo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        .demo-card:nth-child(1) { animation-delay: 0.1s; }
        .demo-card:nth-child(2) { animation-delay: 0.2s; }
        .demo-card:nth-child(3) { animation-delay: 0.3s; }
        .demo-card:nth-child(4) { animation-delay: 0.4s; }
        .demo-card:nth-child(5) { animation-delay: 0.5s; }
        .demo-card:nth-child(6) { animation-delay: 0.6s; }
        .demo-card:nth-child(7) { animation-delay: 0.7s; }
        .demo-card:nth-child(8) { animation-delay: 0.8s; }
        .demo-card:nth-child(9) { animation-delay: 0.9s; }

        .demo-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            display: block;
        }

        .demo-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #667eea;
        }

        .demo-description {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .demo-path {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: #999;
            font-family: 'Courier New', monospace;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 3rem;
            opacity: 0.8;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            .demos-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 前端練習小天地</h1>
            <p class="subtitle">Frontend Playground & Demo Collection</p>
        </header>

        <div class="demos-grid" id="demosGrid">
            <!-- Demos will be populated by JavaScript -->
        </div>

        <footer>
            <p>持續更新中... | Keep Learning, Keep Building 🚀</p>
        </footer>
    </div>

    <script>
        const demos = [
            {
                title: '手風琴效果',
                description: 'Accordion 滑塊展示效果',
                path: 'demos/accroding/index.html',
                icon: '🎹'
            },
            {
                title: '名片卡片',
                description: 'Bootstrap 風格的名片卡片設計',
                path: 'demos/bsCard/index.html',
                icon: '💼'
            },
            {
                title: '貓咪與魚',
                description: 'Fish Cat 互動展示',
                path: 'demos/fishCat/index.html',
                icon: '🐱'
            },
            {
                title: '專案一',
                description: 'Project 1 Demo',
                path: 'demos/proj1/index.html',
                icon: '📦'
            },
            {
                title: '專案二',
                description: 'Project 2 Demo',
                path: 'demos/proj2/index.html',
                icon: '📦'
            },
            {
                title: '全頁滾動',
                description: 'DocSlider 全頁滾動效果',
                path: 'demos/scroll/index.html',
                icon: '📜'
            },
            {
                title: '願望清單',
                description: 'Wish List 功能展示',
                path: 'demos/wishList/index.html',
                icon: '✨'
            },
            {
                title: '表單測試',
                description: 'JavaScript 表單測試頁面',
                path: 'demos/JS_Form Test.html',
                icon: '📝'
            },
            {
                title: '頁面二',
                description: 'Page 2 Demo',
                path: 'demos/page2.html',
                icon: '📄'
            },
            {
                title: '頁面三',
                description: 'Page 3 Demo',
                path: 'demos/page3.html',
                icon: '📄'
            }
        ];

        const demosGrid = document.getElementById('demosGrid');
        
        demos.forEach(demo => {
            const card = document.createElement('a');
            card.href = demo.path;
            card.className = 'demo-card';
            card.innerHTML = `
                <span class="demo-icon">${demo.icon}</span>
                <div class="demo-title">${demo.title}</div>
                <div class="demo-description">${demo.description}</div>
                <div class="demo-path">${demo.path}</div>
            `;
            demosGrid.appendChild(card);
        });
    </script>
</body>
</html>
